name: rotguard
description: Check a markdown site's links and write the safe fixes with rotguard --apply.
branding:
  icon: shield
  color: blue
outputs:
  exit-code:
    description: rotguard's exit code. 0 or 1 mean the fixes are complete (1 means some links need a hand fix); any other code means a failed run.
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path of a markdown file with the report, for a PR body.
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    - id: fetch
      name: Download the release binary
      shell: bash
      run: |
        ref="${GITHUB_ACTION_PATH#*/_actions/*/*/}"
        ref_pattern='^v[0-9]+(\.[0-9]+\.[0-9]+)?$'
        target=''
        if [[ $RUNNER_OS == Linux && $ref =~ $ref_pattern ]]; then
          case "$RUNNER_ARCH" in
            X64) target=x86_64-unknown-linux-musl ;;
            ARM64) target=aarch64-unknown-linux-musl ;;
          esac
        fi
        if [ -z "$target" ]; then
          echo "mode=build" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        version=$("$GITHUB_ACTION_PATH/scripts/cargo-version.sh" "$GITHUB_ACTION_PATH/Cargo.toml") \
          || { echo "::error::rotguard: cannot read the version from Cargo.toml"; exit 1; }
        asset="rotguard-$version-$target"
        base="https://github.com/rdiachenko/rotguard/releases/download/v$version"
        echo "Download rotguard $version (${target%%-*})"
        curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 --silent --show-error --output "$RUNNER_TEMP/$asset" "$base/$asset" \
          || { echo "::error::rotguard: cannot download the release binary ($base/$asset)"; exit 1; }
        curl --fail --location --retry 3 --connect-timeout 10 --max-time 120 --silent --show-error --output "$RUNNER_TEMP/SHA256SUMS" "$base/SHA256SUMS" \
          || { echo "::error::rotguard: cannot download the checksums ($base/SHA256SUMS)"; exit 1; }
        (cd "$RUNNER_TEMP" && grep -F " $asset" SHA256SUMS | sha256sum -c -) \
          || { echo "::error::rotguard: checksum mismatch for $asset"; exit 1; }
        mkdir -p "$GITHUB_ACTION_PATH/target/release" \
          || { echo "::error::rotguard: cannot create target/release ($asset)"; exit 1; }
        install -m 755 "$RUNNER_TEMP/$asset" "$GITHUB_ACTION_PATH/target/release/rotguard" \
          || { echo "::error::rotguard: cannot install $asset"; exit 1; }
        echo "mode=release" >> "$GITHUB_OUTPUT"
    - id: key
      if: steps.fetch.outputs.mode == 'build'
      name: Pick the build cache key
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustc_version=$(rustc +stable --version | cut -d' ' -f2)
        lock_hash=$(sha256sum "$GITHUB_ACTION_PATH/Cargo.lock" | cut -c1-16)
        echo "rustc=$rustc_version" >> "$GITHUB_OUTPUT"
        echo "key=rotguard-$RUNNER_OS-$rustc_version-$lock_hash" >> "$GITHUB_OUTPUT"
        # The action's files carry their commit time, which can be older than a restored build.
        if [ -d "$GITHUB_ACTION_PATH/src" ]; then find "$GITHUB_ACTION_PATH/src" -type f -exec touch {} +; fi
    - id: cache
      if: steps.fetch.outputs.mode == 'build'
      name: Restore the build cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ github.action_path }}/target
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.key.outputs.key }}
        restore-keys: rotguard-${{ runner.os }}-${{ steps.key.outputs.rustc }}-
    - name: Build rotguard
      if: steps.fetch.outputs.mode == 'build'
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        cargo +stable build --release --locked --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
    - id: run
      name: Run rotguard --apply
      shell: bash
      run: |
        report_file="$RUNNER_TEMP/rotguard-report.md"
        set +e
        "$GITHUB_ACTION_PATH/target/release/rotguard" --apply --format markdown > "$report_file"
        code=$?
        set -e
        cat "$report_file"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$report_file" >> "$GITHUB_STEP_SUMMARY"; fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report_file" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Save the build cache
      if: steps.fetch.outputs.mode == 'build' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ github.action_path }}/target
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.key.outputs.key }}
