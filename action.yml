name: rotguard
description: Check a markdown site's links and write the safe fixes with rotguard --apply.
outputs:
  exit-code:
    description: rotguard's exit code. 0 or 1 mean the fixes are complete (1 means some links need a hand fix); any other code means a failed run.
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path of a markdown file with the report, for a PR body.
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    - id: key
      name: Pick the build cache key
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustc_version=$(rustc +stable --version | cut -d' ' -f2)
        lock_hash=$(sha256sum "$GITHUB_ACTION_PATH/Cargo.lock" | cut -c1-16)
        echo "rustc=$rustc_version" >> "$GITHUB_OUTPUT"
        echo "key=rotguard-$RUNNER_OS-$rustc_version-$lock_hash" >> "$GITHUB_OUTPUT"
        # The action's files carry their commit time, which can be older than a restored build.
        if [ -d "$GITHUB_ACTION_PATH/src" ]; then find "$GITHUB_ACTION_PATH/src" -type f -exec touch {} +; fi
    - id: cache
      name: Restore the build cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ github.action_path }}/target
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.key.outputs.key }}
        restore-keys: rotguard-${{ runner.os }}-${{ steps.key.outputs.rustc }}-
    - name: Build rotguard
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        cargo +stable build --release --locked --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
    - id: run
      name: Run rotguard --apply
      shell: bash
      run: |
        report_file="$RUNNER_TEMP/rotguard-report.md"
        set +e
        "$GITHUB_ACTION_PATH/target/release/rotguard" --apply --format markdown > "$report_file"
        code=$?
        set -e
        cat "$report_file"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$report_file" >> "$GITHUB_STEP_SUMMARY"; fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report_file" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Save the build cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ github.action_path }}/target
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: ${{ steps.key.outputs.key }}
