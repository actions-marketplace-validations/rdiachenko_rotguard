[package]
name = "rotguard"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
