name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: scripts/release-verify.sh notes.md
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Check the binary against the tag
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          install -m 755 "target/$TARGET/release/rotguard" "dist/rotguard-$VERSION-$TARGET"
          test "$("dist/rotguard-$VERSION-$TARGET" --version)" = "rotguard $VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: rotguard-${{ matrix.target }}
          path: dist/rotguard-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: rotguard-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: notes
      - run: scripts/release-publish.sh "$GITHUB_REF_NAME" dist notes/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
